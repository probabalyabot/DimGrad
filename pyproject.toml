[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dimgrad"
version = "0.1.0"
description = "A source-to-source compiler that infers and checks the units of derivatives and emits C"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dimgrad = "dimgrad.glue.cli:main"

[tool.setuptools]
packages = ["dimgrad", "dimgrad.frontend", "dimgrad.units", "dimgrad.middle", "dimgrad.diff", "dimgrad.backend", "dimgrad.glue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
